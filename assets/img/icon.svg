<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Music Education Editors' Circle">
  <title>Music Education Editors' Circle</title>
  <defs>
    <linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="66.6" y1="-6.6" x2="133.4" y2="206.6">
      <stop offset="0" stop-color="#1c3f59"/>
      <stop offset="1" stop-color="#2a5b7e"/>
    </linearGradient>
    <clipPath id="ir"><rect width="200" height="200" rx="44" ry="44"/></clipPath>
    <!-- staff lines are drawn everywhere, then hidden inside the ring -->
    <mask id="outside">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="100" cy="100" r="54" fill="#000"/>
    </mask>
  </defs>

  <rect width="200" height="200" rx="44" ry="44" fill="url(#ig)"/>

  <g clip-path="url(#ir)">
    <!-- staff: five lines bleeding to the edges, cleared inside the ring -->
    <g mask="url(#outside)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="6">
      <line x1="0" y1="60"  x2="200" y2="60"/>
      <line x1="0" y1="80"  x2="200" y2="80"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="140" x2="200" y2="140"/>
    </g>

    <!-- the Circle -->
    <circle cx="100" cy="100" r="47" fill="none" stroke="#ffffff" stroke-width="9"/>

    <!-- notehead -->
    <circle cx="100" cy="100" r="21" fill="#b5762f"/>
  </g>
</svg>
